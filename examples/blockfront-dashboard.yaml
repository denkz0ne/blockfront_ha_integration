type: sections
max_columns: 3
title: BF
path: bf
icon: mdi:controller
dense_section_placement: false
header:
  layout: responsive
  badges_position: bottom
  card:
    type: markdown
    text_only: true
    content: |
      # BlockFront
      **denkz0ne** · profil a štatistiky
badges:
  - type: entity
    entity: sensor.denkz0ne_players_online
    name: Online
    show_name: true
    show_state: true
    color: '#a8d8dd'
  - type: entity
    entity: sensor.denkz0ne_statistics_service_status
    name: Štatistická služba
    show_name: true
    show_state: true
  - type: entity
    entity: sensor.service_denkz0ne_cloud_api_polling_status
    name: Online údaje
    show_name: true
    show_state: true
sections:
  - type: grid
    cards:
      - type: heading
        heading: Profil a osobné štatistiky
        heading_style: title
        icon: mdi:account-star
      - type: custom:button-card
        entity: sensor.denkz0ne_rank
        name: Hodnosť
        show_state: true
        show_entity_picture: true
        tap_action: {action: more-info}
        grid_options: {columns: 6, rows: 3}
        styles:
          card:
            - height: 100%
            - padding: 16px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(168,216,221,0.16)
          entity_picture:
            - width: 72px
            - height: 72px
            - object-fit: contain
            - image-rendering: pixelated
          name:
            - font-size: 13px
            - color: var(--secondary-text-color)
          state:
            - font-size: 20px
            - font-weight: '650'
            - white-space: normal
            - line-height: '1.2'
          grid:
            - grid-template-areas: '"i" "n" "s"'
            - grid-template-rows: 80px 20px 1fr
      - type: custom:button-card
        entity: sensor.service_denkz0ne_skill_rank
        name: Skill rank
        show_state: true
        show_entity_picture: true
        tap_action: {action: more-info}
        grid_options: {columns: 6, rows: 3}
        styles:
          card:
            - height: 100%
            - padding: 16px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(200,184,223,0.16)
          entity_picture:
            - width: 112px
            - height: 72px
            - object-fit: contain
            - image-rendering: pixelated
          name:
            - font-size: 13px
            - color: var(--secondary-text-color)
          state:
            - font-size: 20px
            - font-weight: '650'
            - white-space: normal
            - line-height: '1.2'
          grid:
            - grid-template-areas: '"i" "n" "s"'
            - grid-template-rows: 80px 20px 1fr
      - type: custom:button-card
        entity: sensor.service_denkz0ne_experience
        name: Postup k ďalšej hodnosti
        show_icon: false
        show_state: false
        tap_action: {action: more-info}
        grid_options: {columns: 12, rows: 2}
        custom_fields:
          progress: |
            [[[
              const xp = Number(entity.state);
              const current = entity.attributes.rank_exp_progress == null ? NaN : Number(entity.attributes.rank_exp_progress);
              const required = entity.attributes.rank_exp_required == null ? NaN : Number(entity.attributes.rank_exp_required);
              const remaining = entity.attributes.rank_exp_remaining == null ? NaN : Number(entity.attributes.rank_exp_remaining);
              const hasProgress = Number.isFinite(current) && Number.isFinite(required) && required > 0;
              const pct = hasProgress ? Math.max(0, Math.min(100, 100 * current / required)) : 0;
              const fmt = v => Math.round(v).toLocaleString('sk-SK');
              const total = Number.isFinite(xp) ? `${fmt(xp)} XP celkovo` : 'XP nie sú dostupné';
              const progress = hasProgress ? `${fmt(current)} / ${fmt(required)} XP · ${pct.toFixed(1)} %` : 'Postup hodnosti zatiaľ nie je dostupný';
              const left = Number.isFinite(remaining) ? `Do ďalšej hodnosti zostáva ${fmt(remaining)} XP` : 'Zostávajúce XP nie sú dostupné';
              return `<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px"><b style="font-size:25px">${total}</b><span style="color:var(--secondary-text-color);font-size:14px">${progress}</span></div><div style="height:9px;border-radius:8px;background:rgba(128,128,128,.18);overflow:hidden"><div style="height:100%;width:${pct}%;background:#c8b8df"></div></div><div style="margin-top:8px;color:var(--secondary-text-color);font-size:14px">${left}</div>`;
            ]]]
        styles:
          card:
            - height: 100%
            - padding: 16px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(200,184,223,0.10)
          grid:
            - grid-template-areas: '"n" "progress"'
            - grid-template-columns: 1fr
          name:
            - justify-self: start
            - font-size: 14px
            - color: var(--secondary-text-color)
            - padding-bottom: 12px
          custom_fields:
            progress:
              - text-align: left
              - width: 100%
      - type: custom:auto-entities
        card:
          type: grid
          columns: 2
          square: false
        card_param: cards
        filter:
          template: |
            {% set items = [
              ["sensor.denkz0ne_kills", "Eliminácie"],
              ["sensor.denkz0ne_deaths", "Úmrtia"],
              ["sensor.denkz0ne_kill_death_ratio", "Kill / Death"],
              ["sensor.denkz0ne_headshots", "Headshoty"],
              ["sensor.service_denkz0ne_assists", "Asistencie"],
              ["sensor.denkz0ne_time_played", "Odohrané"]
            ] %}
            {% set ns = namespace(cards=[]) %}
            {% for id, label in items %}
              {% if has_value(id) %}
              {% set ns.cards = ns.cards + [{
                "type":"custom:button-card", "entity":id, "name":label,
                "show_icon":false, "show_state":true,
                "state_display":"[[[ const v = Number(entity.state); if (!Number.isFinite(v)) return entity.state === 'on' ? 'Áno' : entity.state === 'off' ? 'Nie' : ['unknown','unavailable'].includes(entity.state) ? '—' : entity.state; if (entity.entity_id.endsWith('time_played')) return v.toFixed(2) + ' h'; if (entity.entity_id.includes('ratio')) return v.toFixed(2); return v.toLocaleString('sk-SK', {maximumFractionDigits:2}); ]]]",
                "tap_action":{"action":"more-info"},
                "styles":{"card":[{"height":"100px"},{"padding":"12px"},{"border-radius":"14px"},{"box-shadow":"none"},{"border":"1px solid var(--divider-color)"},{"background":"rgba(185,216,201,0.14)"}],"grid":[{"grid-template-areas":"\"n\" \"s\""},{"grid-template-columns":"1fr"},{"grid-template-rows":"min-content 1fr"}],"name":[{"justify-self":"start"},{"text-align":"left"},{"white-space":"normal"},{"font-size":"12px"},{"color":"var(--secondary-text-color)"}],"state":[{"justify-self":"start"},{"font-size":"36px"},{"font-weight":"650"},{"color":"var(--primary-text-color)"}]}
              }] %}
              {% endif %}
            {% endfor %}
            {{ ns.cards }}
        show_empty: false
        grid_options: {columns: 12, rows: auto}
      - type: custom:tabbed-card
        tabs:
          - attributes:
              label: Úspechy a profil
            card:
              type: custom:auto-entities
              card:
                type: grid
                columns: 3
                square: false
              card_param: cards
              filter:
                template: |
                  {% set items = [
                    ["sensor.denkz0ne_matches_played", "Zápasy"],
                    ["sensor.service_denkz0ne_trophies", "Trofeje"],
                    ["sensor.service_denkz0ne_match_karma", "Karma"],
                    ["sensor.service_denkz0ne_captures", "Captures"],
                    ["sensor.service_denkz0ne_objective_score", "Objective score"],
                    ["sensor.denkz0ne_prestige", "Prestige"],
                    ["sensor.service_denkz0ne_highest_kill_streak", "Kill streak"],
                    ["sensor.service_denkz0ne_highest_death_streak", "Death streak"],
                    ["sensor.service_denkz0ne_infected_rounds_won", "Infected kolá"],
                    ["sensor.service_denkz0ne_infected_matches_won", "Infected zápasy"],
                    ["binary_sensor.service_denkz0ne", "Bootcamp"]
                  ] %}
                  {% set ns = namespace(cards=[]) %}
                  {% for id, label in items %}
                    {% if has_value(id) %}
                    {% set ns.cards = ns.cards + [{
                      "type":"custom:button-card", "entity":id, "name":label,
                      "show_icon":false, "show_state":true,
                      "state_display":"[[[ const v = Number(entity.state); if (!Number.isFinite(v)) return entity.state === 'on' ? 'Áno' : entity.state === 'off' ? 'Nie' : ['unknown','unavailable'].includes(entity.state) ? '—' : entity.state; if (entity.entity_id.endsWith('time_played')) return v.toFixed(2) + ' h'; if (entity.entity_id.includes('ratio')) return v.toFixed(2); return v.toLocaleString('sk-SK', {maximumFractionDigits:2}); ]]]",
                      "tap_action":{"action":"more-info"},
                      "styles":{"card":[{"height":"88px"},{"padding":"12px"},{"border-radius":"14px"},{"box-shadow":"none"},{"border":"1px solid var(--divider-color)"},{"background":"rgba(185,216,201,0.10)"}],"grid":[{"grid-template-areas":"\"n\" \"s\""},{"grid-template-columns":"1fr"},{"grid-template-rows":"min-content 1fr"}],"name":[{"justify-self":"start"},{"text-align":"left"},{"white-space":"normal"},{"font-size":"12px"},{"color":"var(--secondary-text-color)"}],"state":[{"justify-self":"start"},{"font-size":"27px"},{"font-weight":"650"},{"color":"var(--primary-text-color)"}]}
                    }] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.cards }}
              show_empty: false
          - attributes:
              label: Detail boja
            card:
              type: custom:auto-entities
              card:
                type: grid
                columns: 3
                square: false
              card_param: cards
              filter:
                template: |
                  {% set items = [
                    ["sensor.service_denkz0ne_headshot_kill_ratio", "Headshots / Kills"],
                    ["sensor.denkz0ne_first_bloods", "First bloods"],
                    ["sensor.denkz0ne_no_scopes", "No-scopes"],
                    ["sensor.service_denkz0ne_healing_assists", "Healing assists"],
                    ["sensor.service_denkz0ne_bot_kills", "Boti"],
                    ["sensor.service_denkz0ne_infected_kills", "Infected"],
                    ["sensor.service_denkz0ne_vehicle_kills", "Vozidlá"],
                    ["sensor.service_denkz0ne_fire_kills", "Ohňom"],
                    ["sensor.service_denkz0ne_back_stabs", "Back stabs"]
                  ] %}
                  {% set ns = namespace(cards=[]) %}
                  {% for id, label in items %}
                    {% if has_value(id) %}
                    {% set ns.cards = ns.cards + [{
                      "type":"custom:button-card", "entity":id, "name":label,
                      "show_icon":false, "show_state":true,
                      "state_display":"[[[ const v = Number(entity.state); if (!Number.isFinite(v)) return entity.state === 'on' ? 'Áno' : entity.state === 'off' ? 'Nie' : ['unknown','unavailable'].includes(entity.state) ? '—' : entity.state; if (entity.entity_id.endsWith('time_played')) return v.toFixed(2) + ' h'; if (entity.entity_id.includes('ratio')) return v.toFixed(2); return v.toLocaleString('sk-SK', {maximumFractionDigits:2}); ]]]",
                      "tap_action":{"action":"more-info"},
                      "styles":{"card":[{"height":"88px"},{"padding":"12px"},{"border-radius":"14px"},{"box-shadow":"none"},{"border":"1px solid var(--divider-color)"},{"background":"rgba(185,216,201,0.10)"}],"grid":[{"grid-template-areas":"\"n\" \"s\""},{"grid-template-columns":"1fr"},{"grid-template-rows":"min-content 1fr"}],"name":[{"justify-self":"start"},{"text-align":"left"},{"white-space":"normal"},{"font-size":"12px"},{"color":"var(--secondary-text-color)"}],"state":[{"justify-self":"start"},{"font-size":"27px"},{"font-weight":"650"},{"color":"var(--primary-text-color)"}]}
                    }] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.cards }}
              show_empty: false
        grid_options: {columns: 12, rows: auto}
      - type: button
        name: Otvoriť webový profil
        icon: mdi:open-in-new
        show_state: false
        tap_action: {action: url, url_path: 'https://vuis.dev/blockfront_stats/player.html?uuid=85c194ce-8ae5-4736-bf14-7e9bdd204c66'}
        grid_options: {columns: 12, rows: 1}
        card_mod:
          style: 'ha-card { border-radius: 16px; box-shadow: none; border: 1px solid var(--divider-color); }'
  - type: grid
    cards:
      - type: heading
        heading: Zápasy a servery
        heading_style: title
        icon: mdi:controller
      - type: custom:button-card
        entity: sensor.denkz0ne_latest_match
        show_icon: false
        show_state: true
        name: '[[[ return entity.attributes.map || ''Posledný zápas''; ]]]'
        state_display: '[[[ return entity.state === ''win'' ? ''Výhra'' : entity.state === ''loss'' ? ''Prehra'' : entity.state; ]]]'
        custom_fields:
          numbers: |-
            [[[
              const stats = [['kills','Eliminácie'],['deaths','Úmrtia'],['assists','Asistencie'],['score','Skóre']];
              return '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px">' + stats.map(([key,label]) => `<div><div style="font-size:32px;font-weight:650;color:var(--primary-text-color)">${entity.attributes[key] ?? '—'}</div><div style="font-size:11px;color:var(--secondary-text-color);margin-top:4px">${label}</div></div>`).join('') + '</div>';
            ]]]
        tap_action: {action: more-info}
        grid_options: {columns: 12, rows: 3}
        styles:
          card:
            - height: 100%
            - padding: 16px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(232,196,175,0.14)
          grid:
            - grid-template-areas: '"n" "s" "numbers"'
            - grid-template-columns: 1fr
            - grid-template-rows: min-content min-content 1fr
          name:
            - justify-self: start
            - font-size: 24px
            - font-weight: '650'
          state:
            - justify-self: start
            - font-size: 16px
            - color: var(--secondary-text-color)
            - padding-top: 4px
          custom_fields:
            numbers:
              - width: 100%
              - align-self: end
              - padding-top: 16px
      - type: markdown
        title: Detail zápasu
        content: |
          {% set e = 'sensor.denkz0ne_latest_match' %}
          {% set game = state_attr(e, 'game') %}
          {% set result = states(e) %}
          {% set ended_ago = state_attr(e, 'ended_ago') %}
          {% set ended_at = state_attr(e, 'ended_at') %}
          {% set match_source = state_attr(e, 'source') %}

          | Štatistika | Hodnota |
          |:--|--:|
          | Mapa | {{ state_attr(e, 'map') or '—' }} |
          | Režim | {{ game or '—' }} |
          | Výsledok | {{ 'Výhra' if result == 'win' else 'Prehra' if result == 'loss' else result or '—' }} |
          | Umiestnenie | {{ state_attr(e, 'placement') if state_attr(e, 'placement') is not none else '—' }} |
          | Tvoj tím | {{ state_attr(e, 'player_team') or '—' }} |
          | Čas zápasu | {{ as_local(as_datetime(ended_at)).strftime('%d.%m.%Y %H:%M') if ended_at else ended_ago or '—' }} |
          | Načítané zápasy | {{ state_attr(e, 'recent_matches_available') or '—' }} |
          {% if match_source %}| Zdroj | {{ 'Scrapovaný profil' if match_source == 'vuis_website' else match_source }} |{% endif %}
        card_mod:
          style: ha-card { border-radius:16px; box-shadow:none; font-size:16px; border:1px solid var(--divider-color); }
        grid_options: {columns: 12, rows: auto}
      - type: custom:button-card
        entity: sensor.denkz0ne_players_online
        name: Hráči online
        show_icon: false
        show_state: true
        state_display: '[[[ const v = Number(entity.state); if (!Number.isFinite(v)) return entity.state === ''on'' ? ''Áno'' : entity.state === ''off'' ? ''Nie'' : [''unknown'',''unavailable''].includes(entity.state) ? ''—'' : entity.state; if (entity.entity_id.endsWith(''time_played'')) return v.toFixed(2) + '' h''; if (entity.entity_id.includes(''ratio'')) return v.toFixed(2); return v.toLocaleString(''sk-SK'', {maximumFractionDigits:2}); ]]]'
        tap_action: {action: more-info}
        grid_options: {columns: 12, rows: 2}
        styles:
          card:
            - height: 100%
            - padding: 16px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(186,203,223,0.14)
          grid:
            - grid-template-areas: '"n s"'
            - grid-template-columns: 1fr auto
          name:
            - justify-self: start
            - font-size: 17px
            - color: var(--secondary-text-color)
          state:
            - font-size: 42px
            - font-weight: '650'
      - type: custom:button-card
        entity: sensor.denkz0ne_statistics_service_status
        name: Štatistická služba
        show_icon: false
        show_state: true
        state_display: '[[[ const labels = {degraded:''Obmedzená'',available:''Dostupné'',healthy:''V poriadku'',ok:''V poriadku'',online:''V poriadku'',rate_limited:''Limit požiadaviek'',unavailable:''Nedostupné'',unknown:''Neznáme''}; return labels[entity.state] || entity.state; ]]]'
        tap_action: {action: more-info}
        grid_options: {columns: 6, rows: 2}
        styles:
          card:
            - height: 100%
            - padding: 14px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(186,203,223,0.10)
          grid:
            - grid-template-areas: '"n" "s"'
            - grid-template-columns: 1fr
          name:
            - justify-self: start
            - font-size: 12px
            - color: var(--secondary-text-color)
          state:
            - justify-self: start
            - font-size: 19px
            - font-weight: '600'
            - white-space: normal
      - type: custom:button-card
        entity: sensor.service_denkz0ne_cloud_api_polling_status
        name: Online údaje
        show_icon: false
        show_state: true
        state_display: '[[[ const labels = {degraded:''Obmedzená'',available:''Dostupné'',healthy:''V poriadku'',ok:''V poriadku'',online:''V poriadku'',rate_limited:''Limit požiadaviek'',unavailable:''Nedostupné'',unknown:''Neznáme''}; return labels[entity.state] || entity.state; ]]]'
        tap_action: {action: more-info}
        grid_options: {columns: 6, rows: 2}
        styles:
          card:
            - height: 100%
            - padding: 14px
            - border-radius: 16px
            - box-shadow: none
            - border: 1px solid var(--divider-color)
            - background: rgba(186,203,223,0.10)
          grid:
            - grid-template-areas: '"n" "s"'
            - grid-template-columns: 1fr
          name:
            - justify-self: start
            - font-size: 12px
            - color: var(--secondary-text-color)
          state:
            - justify-self: start
            - font-size: 19px
            - font-weight: '600'
            - white-space: normal
      - type: markdown
        content: |
          <details>
          <summary>Načítanie údajov a limity API</summary>

          {% set profile = 'sensor.service_denkz0ne_experience' %}
          {% set cloud = 'sensor.service_denkz0ne_cloud_api_polling_status' %}
          {% set service = 'sensor.denkz0ne_statistics_service_status' %}
          {% set loaded = state_attr(profile, 'last_successful_update') %}
          {% set cloud_loaded = state_attr(cloud, 'cloud_last_successful_update') %}
          {% set interval = state_attr(cloud, 'poll_interval_seconds') %}
          {% set limit = state_attr(cloud, 'cloud_rate_limit_limit') %}
          {% set remaining = state_attr(cloud, 'cloud_rate_limit_remaining') %}
          {% set retry = state_attr(cloud, 'cloud_retry_after') %}
          {% set reset = state_attr(cloud, 'scoreboard_reset_time') %}
          | Údaj | Hodnota |
          |:--|:--|
          | Profil načítaný | {{ as_local(as_datetime(loaded)).strftime('%d.%m. %H:%M') if loaded else '—' }} |
          | Cloud načítaný | {{ as_local(as_datetime(cloud_loaded)).strftime('%d.%m. %H:%M') if cloud_loaded else '—' }} |
          | Polling | {{ (interval | int / 60) | round(2) if interval is not none else '—' }} min |
          | Limit API | {{ limit if limit is not none else 'Server ho neposkytuje' }} |
          {% if remaining is not none %}| Zostáva požiadaviek | {{ remaining }} |{% endif %}
          {% if retry is not none %}| Retry-After | {{ retry }} |{% endif %}
          | Reset scoreboardu | {{ as_local(as_datetime(reset)).strftime('%d.%m.%Y %H:%M') if reset else '—' }} |

          {% if state_attr(profile, 'stale') %}⚠️ **Lokálna kópia profilu je označená ako zastaraná.**{% endif %}
          {% if is_state(service, 'degraded') %}
          ⚠️ **Upstream služba je obmedzená.** Čerstvé načítanie nemusí znamenať čerstvé herné údaje.

          Zastarané feedy: **{{ state_attr(service, 'stale_feed_count') if state_attr(service, 'stale_feed_count') is not none else '—' }}**
          {% endif %}
          {% set error = state_attr(cloud, 'api_error') or state_attr(profile, 'last_error') or state_attr(service, 'upstream_error') %}
          {% if error %}**Posledná chyba:** {{ error }}{% endif %}

          </details>
        grid_options: {columns: 12, rows: auto}
        card_mod:
          style: 'ha-card { border-radius: 16px; box-shadow: none; border: 1px solid var(--divider-color); }'
  - type: grid
    cards:
      - type: heading
        heading: Grafy a prehľady
        heading_style: title
        icon: mdi:chart-line
      - type: statistics-graph
        title: Získané XP · posledných 7 dní
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - change
        entities:
          - {entity: sensor.service_denkz0ne_experience, name: XP za deň, color: '#c8b8df'}
        hide_legend: true
        grid_options: {columns: 12, rows: 4}
        card_mod:
          style: 'ha-card { border-radius: 16px; box-shadow: none; border: 1px solid var(--divider-color); }'
      - type: statistics-graph
        title: Eliminácie a úmrtia · za deň
        days_to_show: 7
        period: day
        chart_type: bar
        stat_types:
          - change
        entities:
          - {entity: sensor.denkz0ne_kills, name: Eliminácie, color: '#b4cdbb'}
          - {entity: sensor.denkz0ne_deaths, name: Úmrtia, color: '#dcb8c1'}
        grid_options: {columns: 12, rows: 4}
        card_mod:
          style: 'ha-card { border-radius: 16px; box-shadow: none; border: 1px solid var(--divider-color); }'
      - type: custom:mini-graph-card
        name: Vývoj pomerov · 7 dní
        hours_to_show: 168
        points_per_hour: 1
        decimals: 2
        line_width: 3
        height: 110
        entities:
          - {entity: sensor.denkz0ne_kill_death_ratio, name: K/D, color: '#b4cdbb'}
          - {entity: sensor.service_denkz0ne_headshot_kill_ratio, name: Headshoty / eliminácie, color: '#dcb8c1'}
        show:
          labels: true
          legend: true
          fill: false
          state: false
        grid_options: {columns: 12, rows: auto}
