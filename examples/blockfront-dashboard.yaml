        const parts = variables.items.map(([id,label,unit,decimals=0,optional=false]) => {\n  const e\
        \ = hass.states[id];\n  if ((!valid(e) || e.state === '') && optional) return '';\n  let raw =\
        \ valid(e) ? e.state : null;\n  if (e?.entity_id?.startsWith('binary_sensor.') && raw !== null)\
        \ raw = raw === 'on' ? 'Áno' : 'Nie';\n  let n = raw === null ? NaN : Number(raw);\n  if (unit\
        \ === 'h' && Number.isFinite(n)) {\n    const u = e?.attributes?.unit_of_measurement;\n    if\
        \ (['s','seconds'].includes(u)) n /= 3600;\n    else if (['min','minutes'].includes(u)) n /= 60;\n\
        \  }\n  const numeric = Number.isFinite(n);\n  const shown = raw === null ? '—' : numeric ? n.toLocaleString('sk-SK',{minimumFractionDigits:decimals,maximumFractionDigits:decimals})\
        \ : raw;\n  const icons = {kills:'crosshairs',deaths:'skull-outline',kill_death_ratio:'scale-balance',headshots:'target',assists:'handshake-outline',time_played:'clock-outline',matches_played:'controller',wins:'trophy-outline',win_rate:'percent',objective_score:'bullseye-arrow',prestige:'star-outline',first_bloods:'water',no_scopes:'crosshairs-off',kill_streak:'fire',death_streak:'skull',heal_assists:'medical-bag',bot_kills:'robot-outline',infected_kills:'biohazard',vehicle_kills:'tank',fire_kills:'fire',back_stabs:'knife-military',infected_rounds_won:'trophy-outline',infected_matches_won:'trophy',match_karma:'heart-outline',class_xp:'account-star',rifleman_xp:'account-star',lieutenant_rifle_xp:'account-star',assault_xp:'account-star',support_xp:'account-star',medic_xp:'account-star',sniper_xp:'account-star',gunner_xp:'account-star',anti_tank_xp:'account-star',completed_bootcamp:'school'};\n\
        \  const suffix = id.replace(/^sensor\\.(service_)?denkz0ne_/,'').replace(/^binary_sensor\\.denkz0ne_/,'');\n\
        \  const icon = icons[suffix] || 'chart-box-outline';\n  const size = numeric ? Math.max(25,variables.size-(String(shown).length>6?4:0))\
        \ : 19;\n  return '<div style=\"padding:8px;border-radius:10px;background:'+variables.tint+';min-width:0\"\
        ><div style=\"font-size:14px;line-height:20px;color:#536577;display:flex;align-items:center;gap:4px\"\
        ><ha-icon icon=\"mdi:'+icon+'\" style=\"margin:0;--mdc-icon-size:17px;flex-shrink:0\"></ha-icon><span>'+esc(label)+'</span></div><div\
        \ style=\"font-size:'+size+'px;font-weight:700;line-height:1.22;letter-spacing:-.6px;margin-top:4px;overflow-wrap:anywhere\"\
        >'+esc(shown)+'<span style=\"font-size:14px;font-weight:500;letter-spacing:0;margin-left:3px\"\
        >'+(raw !== null ? esc(unit) : '')+'</span></div></div>';\n}).join('');\nreturn (variables.title\
        \ ? '<div style=\"font-size:16px;font-weight:650;margin-bottom:9px\">'+esc(variables.title)+'</div>'\
        \ : '')+'<div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px\">'+parts+'</div>'+(variables.note\
        \ ? '<div style=\"font-size:14px;color:#536577;margin-top:7px\">'+esc(variables.note)+'</div>'\
        \ : '');\n]]]"
