name: Publish BlockFront Stats v0.6.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v0.6.0.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Read release version
        uses: actions/checkout@v4
      - name: Publish v0.6.0 release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version=$(python -c 'import json; print(json.load(open("custom_components/blockfront/manifest.json"))["version"])')
          test "$version" = "0.6.0"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release v$version already exists"
            exit 0
          fi
          gh release create "v$version" \
            --target "$GITHUB_SHA" \
            --title "BlockFront Stats $version" \
            --notes "Adds an optional Community API with a configurable URL and independent source choices for player profile and match history. Existing provider remains the default and entity identifiers stay unchanged."
