type: sections
max_columns: 3
title: BF
path: bf
icon: mdi:controller
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: heading
    heading: Profil a progres
    icon: mdi:account-star
    heading_style: title
    card_mod:
      style: 'ha-card { color: #243744; --primary-text-color: #243744; --secondary-text-color: #536577;
        }'
  - type: custom:button-card
    entity: sensor.denkz0ne_experience
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    hold_action:
      action: more-info
    grid_options:
      columns: 12
      rows: auto
    styles:
      card:
      - padding: 12px
      - border-radius: 14px
      - box-shadow: none
      - border: '1px solid #dfe6ed'
      - background: '#ffffff'
      - color: '#243744'
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        body:
        - width: 100%
        - min-width: '0'
        - text-align: left
        - white-space: normal
        - overflow: hidden
    triggers_update:
    - sensor.denkz0ne_experience
    - sensor.denkz0ne_rank
    - sensor.denkz0ne_skill_rank
    custom_fields:
      body: '[[[

        const st = id => hass.states[id];

        const valid = e => e && ![''unknown'',''unavailable'',''''].includes(e.state);

        const esc = v => String(v ?? ''—'').replace(/[&<>"'']/g,c=>({''&'':''&amp;'',''<'':''&lt;'',''>'':''&gt;'',''"'':''&quot;'',"''":''&#39;''}[c]));

        const fmt = v => Number(v).toLocaleString(''sk-SK'',{maximumFractionDigits:0});

        const xp = valid(entity) ? Number(entity.state) : NaN;

        const attrs = entity?.attributes || {};

        const current = Number(attrs.rank_exp_progress);

        const required = Number(attrs.rank_exp_required);

        const remaining = Number(attrs.rank_exp_remaining);

        const hasProgress = Number.isFinite(current) && Number.isFinite(required) && required > 0;

        const pct = hasProgress ? Math.max(0,Math.min(100,100*current/required)) : NaN;

        const rank = st(''sensor.denkz0ne_rank''), skill = st(''sensor.denkz0ne_skill_rank'');

        const badge = (e,label,bg) => ''<div style="display:flex;align-items:center;gap:7px;padding:8px;border-radius:10px;background:''+bg+'';min-width:0"><div
        style="min-width:0"><div style="font-size:14px;line-height:20px;color:#536577">''+label+''</div><b
        style="font-size:16px;line-height:21px;overflow-wrap:anywhere">''+(valid(e)?esc(e.state):''—'')+''</b></div></div>'';

        const pctText = Number.isFinite(pct) ? pct.toLocaleString(''sk-SK'',{maximumFractionDigits:1})+''
        %'' : ''—'';

        return ''<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><div
        style="display:flex;align-items:center;gap:8px"><ha-icon icon="mdi:controller" style="margin:0;--mdc-icon-size:25px;color:#806694"></ha-icon><b
        style="font-size:26px;letter-spacing:-.5px">denkz0ne</b></div><a href="https://vuis.dev/bfstats/players/denkz0ne/stats"
        target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:4px;color:#536577;font-size:14px;text-decoration:none">Profil<ha-icon
        icon="mdi:open-in-new" style="margin:0;--mdc-icon-size:18px"></ha-icon></a></div><div style="display:grid;grid-template-columns:1fr
        1fr;gap:7px">''+badge(rank,''Hodnosť'',''#edf5f8'')+badge(skill,''Skill rank'',''#f3eef9'')+''</div><div
        style="background:#f6f2fa;border-radius:10px;padding:10px;margin-top:9px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div
        style="font-size:14px;color:#536577;line-height:20px"><ha-icon icon="mdi:star-four-points-outline"
        style="margin:0;--mdc-icon-size:17px"></ha-icon> Skúsenosti</div><b style="font-size:32px;line-height:1.25;letter-spacing:-.6px">''+(Number.isFinite(xp)?fmt(xp):''—'')+''<span
        style="font-size:16px;font-weight:500;margin-left:4px">XP</span></b></div><div style="text-align:right;font-size:14px;color:#536577">Do
        hodnosti<br><b style="font-size:20px;color:#243744">''+(Number.isFinite(remaining)?fmt(remaining):''—'')+''
        XP</b></div></div><div style="display:flex;justify-content:space-between;gap:6px;font-size:14px;line-height:20px;margin:8px
        0 5px"><span>Postup hodnosti · ''+(Number.isFinite(current)&&Number.isFinite(required)?fmt(current)+''
        / ''+fmt(required)+'' XP'':''údaje nie sú dostupné'')+''</span><b>''+pctText+''</b></div><div
        role="progressbar" aria-label="Postup hodnosti" aria-valuemin="0" aria-valuemax="100" aria-valuenow="''+(Number.isFinite(pct)?pct:0)+''"
        style="height:7px;background:#e6dfee;border-radius:6px;overflow:hidden"><div style="height:100%;width:''+(Number.isFinite(pct)?pct:0)+''%;background:#b9a5cf"></div></div></div>'';

        ]]]'
