type: sections
max_columns: 3
title: BF
path: bf
icon: mdi:controller
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: heading
    heading: Profil a progres
    icon: mdi:account-star
    heading_style: title
    card_mod:
      style: 'ha-card { color: #243744; --primary-text-color: #243744; --secondary-text-color: #536577; }'
  - type: custom:button-card
    entity: sensor.service_denkz0ne_experience
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: &id001
      card:
      - padding: 12px
      - border-radius: 14px
      - box-shadow: none
      - border: '1px solid #dfe6ed'
      - background: '#ffffff'
      - color: '#243744'
      grid:
      - grid-template-areas: '"body"'
      - grid-template-columns: minmax(0, 1fr)
      custom_fields:
        body:
        - width: 100%
        - min-width: '0'
        - text-align: left
        - white-space: normal
        - overflow: hidden
    triggers_update:
    - sensor.service_denkz0ne_experience
    - sensor.denkz0ne_rank
    - sensor.service_denkz0ne_skill_rank
    - sensor.service_denkz0ne_recorded_profile_history
    custom_fields:
      body: |-
        [[[
        const st = id => hass.states[id];
        const esc = v => String(v ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const valid = e => e && !['unknown','unavailable',''].includes(e.state);
        const fmt = v => v.toLocaleString('sk-SK', {maximumFractionDigits:0});
        const rank=st('sensor.denkz0ne_rank'), skill=st('sensor.service_denkz0ne_skill_rank');
        const badge = (e,label,bg) => {
          const image=valid(e)&&e.attributes.entity_picture?.startsWith('/api/blockfront/icons/') ? `<img src="${esc(e.attributes.entity_picture)}" alt="" style="width:42px;height:34px;object-fit:contain;image-rendering:pixelated;flex-shrink:0">` : '';
          return `<div style="display:flex;align-items:center;gap:7px;padding:8px;border-radius:10px;background:${bg};min-width:0">${image}<div style="min-width:0"><div style="font-size:14px;line-height:20px;color:#536577">${label}</div><b style="font-size:16px;line-height:21px;overflow-wrap:anywhere">${valid(e)?esc(e.state):'—'}</b></div></div>`;
        };
        const xp=valid(entity)?Number(entity.state):NaN;
        const levels=[0,1,1001,3001,6001,10001,16001,23501,32501,43001,55001,69001,85001,103001,123001,145001,169001,195001,223001,253001];
        const next=levels.find(v=>v>xp), base=[...levels].reverse().find(v=>v<=xp)??0;
        const pct=Number.isFinite(xp)?(next?Math.max(0,Math.min(100,100*(xp-base)/(next-base))):100):0;
        const points=(st('sensor.service_denkz0ne_recorded_profile_history')?.attributes?.history_points||[]).filter(p=>typeof p.exp==='number'&&Number.isFinite(p.exp)&&Number.isFinite(Date.parse(p.capturedAt))).sort((a,b)=>Date.parse(a.capturedAt)-Date.parse(b.capturedAt));
        let spark='',change='História XP zatiaľ nie je dostupná';
        if(points.length>1){
          const first=points[0],last=points[points.length-1],xs=points.map(p=>Date.parse(p.capturedAt)),ys=points.map(p=>p.exp);
          const x0=xs[0],dx=xs[xs.length-1]-x0,lo=Math.min(...ys),dy=Math.max(...ys)-lo;
          const coords=points.map((p,i)=>`${(4+(xs[i]-x0)/(dx||1)*96).toFixed(1)},${(38-(p.exp-lo)/(dy||1)*32).toFixed(1)}`).join(' ');
          spark=`<svg viewBox="0 0 104 44" style="width:104px;height:44px;flex-shrink:0" role="img" aria-label="Vývoj uložených XP"><polyline points="${coords}" fill="none" stroke="#9b82b6" stroke-width="3" stroke-linejoin="round"/></svg>`;
          const delta=last.exp-first.exp;
          const date=p=>new Date(p.capturedAt).toLocaleDateString('sk-SK',{timeZone:hass.config.time_zone,day:'numeric',month:'numeric'});
          change=`${delta>0?'+':''}${fmt(delta)} XP · ${date(first)} – ${date(last)}`;
        }
        return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px"><div style="display:flex;align-items:center;gap:8px"><ha-icon icon="mdi:controller" style="margin:0;--mdc-icon-size:25px;color:#806694"></ha-icon><b style="font-size:26px;letter-spacing:-.5px">denkz0ne</b></div><a href="https://preview.blocklytics.naknu.li/player/85c194ce-8ae5-4736-bf14-7e9bdd204c66" target="_blank" rel="noopener noreferrer" style="display:flex;align-items:center;gap:4px;color:#536577;font-size:14px;text-decoration:none">Profil<ha-icon icon="mdi:open-in-new" style="margin:0;--mdc-icon-size:18px"></ha-icon></a></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:7px">${badge(rank,'Hodnosť','#edf5f8')}${badge(skill,'Skill rank','#f3eef9')}</div><div style="background:#f6f2fa;border-radius:10px;padding:10px;margin-top:9px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><div style="font-size:14px;color:#536577;line-height:20px"><ha-icon icon="mdi:star-four-points-outline" style="margin:0;--mdc-icon-size:17px"></ha-icon> Skúsenosti</div><b style="font-size:32px;line-height:1.25;letter-spacing:-.6px">${Number.isFinite(xp)?fmt(xp):'—'}<span style="font-size:16px;font-weight:500;margin-left:4px">XP</span></b></div>${spark}</div><div style="font-size:14px;color:#536577;line-height:20px;margin-top:3px">${change}</div><div style="display:flex;justify-content:space-between;gap:6px;font-size:14px;line-height:20px;margin:8px 0 5px"><span>Postup hodnosti</span><b>${Number.isFinite(xp)?pct.toLocaleString('sk-SK',{maximumFractionDigits:2})+' %':'—'}</b></div><div role="progressbar" aria-label="Postup hodnosti" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" style="height:7px;background:#e6dfee;border-radius:6px;overflow:hidden"><div style="height:100%;width:${pct}%;background:#b9a5cf"></div></div><div style="font-size:14px;line-height:20px;color:#536577;margin-top:5px">${Number.isFinite(xp)?(next?`Do ďalšej hodnosti ${fmt(next-xp)} XP`:'Maximum tabuľky hodností'):'XP zatiaľ nie sú dostupné'}</div></div>`;
        ]]]
  - type: custom:button-card
    entity: sensor.denkz0ne_kills
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: *id001
    triggers_update:
    - sensor.denkz0ne_kills
    - sensor.denkz0ne_deaths
    - sensor.denkz0ne_kill_death_ratio
    - sensor.denkz0ne_headshots
    - sensor.service_denkz0ne_assists
    - sensor.denkz0ne_time_played
    variables:
      title: Kariéra · celkové hodnoty
      items:
      - [sensor.denkz0ne_kills, Eliminácie, '', 0]
      - [sensor.denkz0ne_deaths, Úmrtia, '', 0]
      - [sensor.denkz0ne_kill_death_ratio, K/D, '', 2]
      - [sensor.denkz0ne_headshots, Headshoty, '', 0]
      - [sensor.service_denkz0ne_assists, Asistencie, '', 0]
      - [sensor.denkz0ne_time_played, Odohrané, h, 2]
      tint: '#edf7f0'
      size: 32
    custom_fields:
      body: &id002 |-
        [[[
        const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const valid = e => e && !['unknown','unavailable',''].includes(e.state);
        const parts = variables.items.map(([id, label, unit, decimals = 0, optional = false]) => {
          let e = hass.states[id], raw = valid(e) ? e.state : null;
          if (id === '@map') {
            const a = hass.states['sensor.service_denkz0ne_most_played_map']?.attributes;
            const rows = Array.isArray(a?.maps) ? [...a.maps].sort((a,b) => (b.games ?? -1)-(a.games ?? -1)) : [];
            raw = rows[0]?.name ?? rows[0]?.mapName ?? rows[0]?.key ?? null;
          }
          if (raw === null && optional) return '';
          let n = raw === null ? NaN : Number(raw);
          if (unit === 'h' && Number.isFinite(n)) {
            const u = e?.attributes?.unit_of_measurement;
            if (['s','seconds'].includes(u)) n /= 3600;
            else if (['min','minutes'].includes(u)) n /= 60;
          }
          const numeric = Number.isFinite(n);
          const text = raw === null ? '—' : numeric ? n.toLocaleString('sk-SK', {minimumFractionDigits:decimals,maximumFractionDigits:decimals}) : raw;
          const icons={kills:'crosshairs',deaths:'skull-outline',kill_death_ratio:'scale-balance',headshots:'target',assists:'handshake-outline',time_played:'clock-outline',matches_played:'controller',captures:'flag-outline',objective_score:'bullseye-arrow',highest_kill_streak:'fire',highest_death_streak:'skull',prestige:'star-outline',first_bloods:'water',no_scopes:'crosshairs-off',headshot_kill_ratio:'target',healing_assists:'medical-bag',bot_kills:'robot-outline',infected_kills:'biohazard',vehicle_kills:'tank',fire_kills:'fire',back_stabs:'knife-military',infected_rounds_won:'trophy-outline',infected_matches_won:'trophy',match_karma:'heart-outline',tracked_matches:'clipboard-list-outline',recorded_wins:'trophy-outline',recorded_losses:'close-circle-outline',recorded_win_rate:'percent',average_recorded_match_score:'counter','@map':'map-outline'};
          const suffix=id.replace(/^sensor\.(service_)?denkz0ne_/,''), icon=icons[suffix]||'chart-box-outline';
          const length=String(text).length+(unit?1:0), size=numeric?Math.max(26,variables.size-(length>5?4:0)):20;
          return `<div style="padding:8px;border-radius:10px;background:${variables.tint};min-width:0"><div style="font-size:14px;line-height:20px;color:#536577;display:flex;align-items:center;gap:4px"><ha-icon icon="mdi:${icon}" style="margin:0;--mdc-icon-size:17px;flex-shrink:0"></ha-icon><span>${esc(label)}</span></div><div style="font-size:${size}px;font-weight:700;line-height:1.22;letter-spacing:-.6px;margin-top:4px;overflow-wrap:anywhere">${esc(text)}<span style="font-size:14px;font-weight:500;letter-spacing:0;margin-left:3px">${raw !== null ? esc(unit) : ''}</span></div></div>`;
        }).join('');
        return `${variables.title ? `<div style="font-size:16px;font-weight:650;margin-bottom:9px">${esc(variables.title)}</div>` : ''}<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px">${parts}</div>${variables.note ? `<div style="font-size:14px;color:#536577;margin-top:7px">${esc(variables.note)}</div>` : ''}`;
        ]]]
  - type: custom:tabbed-card
    styles: &id003
      --mdc-theme-primary: '#806694'
      --mdc-tab-text-label-color: '#536577'
      --mdc-typography-button-font-size: 14px
      --mdc-tab-height: 38px
      --mdc-theme-surface: '#ffffff'
    grid_options: {columns: 12, rows: auto}
    tabs:
    - attributes: {label: Ciele}
      card:
        type: custom:button-card
        entity: sensor.denkz0ne_matches_played
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        triggers_update:
        - sensor.denkz0ne_matches_played
        - sensor.service_denkz0ne_captures
        - sensor.service_denkz0ne_objective_score
        - sensor.service_denkz0ne_highest_kill_streak
        - sensor.service_denkz0ne_highest_death_streak
        - sensor.denkz0ne_prestige
        variables:
          title: Ciele a rekordy
          items:
          - [sensor.denkz0ne_matches_played, Zápasy, '', 0]
          - [sensor.service_denkz0ne_captures, Obsadenia, '', 0]
          - [sensor.service_denkz0ne_objective_score, Cieľové skóre, '', 0]
          - [sensor.service_denkz0ne_highest_kill_streak, Kill streak, '', 0]
          - [sensor.service_denkz0ne_highest_death_streak, Death streak, '', 0]
          - [sensor.denkz0ne_prestige, Prestíž, '', 0]
          tint: '#f3eef9'
          size: 30
        custom_fields:
          body: *id002
    - attributes: {label: Boj}
      card:
        type: custom:button-card
        entity: sensor.denkz0ne_first_bloods
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        triggers_update:
        - sensor.denkz0ne_first_bloods
        - sensor.denkz0ne_no_scopes
        - sensor.service_denkz0ne_headshot_kill_ratio
        - sensor.service_denkz0ne_healing_assists
        - sensor.service_denkz0ne_bot_kills
        - sensor.service_denkz0ne_infected_kills
        - sensor.service_denkz0ne_vehicle_kills
        - sensor.service_denkz0ne_fire_kills
        - sensor.service_denkz0ne_back_stabs
        - sensor.service_denkz0ne_infected_rounds_won
        - sensor.service_denkz0ne_infected_matches_won
        - sensor.service_denkz0ne_match_karma
        variables:
          title: ''
          items:
          - [sensor.denkz0ne_first_bloods, First bloods, '', 0]
          - [sensor.denkz0ne_no_scopes, No-scopes, '', 0]
          - [sensor.service_denkz0ne_headshot_kill_ratio, Headshoty / kills, '', 2]
          - [sensor.service_denkz0ne_healing_assists, Liečenie · asist., '', 0]
          - [sensor.service_denkz0ne_bot_kills, Boti, '', 0]
          - [sensor.service_denkz0ne_infected_kills, Infected · kills, '', 0]
          - [sensor.service_denkz0ne_vehicle_kills, Vozidlá · kills, '', 0]
          - [sensor.service_denkz0ne_fire_kills, Ohňom, '', 0]
          - [sensor.service_denkz0ne_back_stabs, Back stabs, '', 0]
          - [sensor.service_denkz0ne_infected_rounds_won, Infected · kolá, '', 0]
          - [sensor.service_denkz0ne_infected_matches_won, Infected · výhry, '', 0]
          - [sensor.service_denkz0ne_match_karma, Karma, '', 0, true]
          tint: '#edf3fa'
          size: 30
        custom_fields:
          body: *id002
    - attributes: {label: Zmena}
      card:
        type: custom:button-card
        entity: sensor.service_denkz0ne_recorded_profile_history
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        custom_fields:
          body: |-
            [[[
            const rows = Array.isArray(entity?.attributes?.history_points) ? [...entity.attributes.history_points].filter(p => Number.isFinite(Date.parse(p.capturedAt))).sort((a,b) => Date.parse(a.capturedAt)-Date.parse(b.capturedAt)) : [];
            if (rows.length < 2) return '<div style="padding:20px 0;font-size:14px;color:#536577">Zmeny sa zobrazia po dvoch uložených snímkach profilu.</div>';
            const first=rows[0], last=rows[rows.length-1];
            const date = p => new Date(p.capturedAt).toLocaleDateString('sk-SK',{timeZone:hass.config.time_zone,day:'2-digit',month:'2-digit'});
            const fields=[['exp','XP',1,''],['kills','Eliminácie',1,''],['totalGames','Zápasy',1,''],['timePlayedSeconds','Odohrané',3600,' h']];
            const tiles=fields.map(([key,label,divisor,unit]) => {
              const valid=typeof first[key]==='number' && typeof last[key]==='number';
              const n=valid ? (last[key]-first[key])/divisor : NaN;
              const v=Number.isFinite(n) ? `${n>0?'+':''}${n.toLocaleString('sk-SK',{maximumFractionDigits:divisor===3600?2:0})}${unit}` : '—';
              return `<div style="padding:8px;border-radius:9px;background:rgba(157,196,179,.16)"><div style="font-size:14px;color:#536577">${label}</div><b style="font-size:25px;line-height:1.4">${v}</b></div>`;
            }).join('');
            return `<div style="font-size:14px;color:#536577;margin-bottom:9px">Zmena ${date(first)} – ${date(last)} · ${rows.length} snímky API</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${tiles}</div><div style="font-size:14px;color:#536577;margin-top:8px">Rozdiel uložených pozorovaní; nie presný denný súčet.</div>`;
            ]]]
- type: grid
  cards:
  - type: heading
    heading: Zápasy a výkon
    icon: mdi:controller
    heading_style: title
    card_mod:
      style: 'ha-card { color: #243744; --primary-text-color: #243744; --secondary-text-color: #536577; }'
  - type: custom:button-card
    entity: sensor.denkz0ne_latest_match
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: *id001
    custom_fields:
      body: |-
        [[[
        const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const a=entity?.attributes||{}, known=entity && !['unknown','unavailable',''].includes(entity.state);
        const title='<div style="font-size:14px;color:#536577;margin-bottom:8px">Posledný zápas</div>';
        if (!known) return `${title}<div style="display:flex;gap:12px;align-items:center;min-height:94px"><ha-icon icon="mdi:clipboard-clock-outline" style="margin:0;--mdc-icon-size:31px;color:#b5a5cd"></ha-icon><div><b style="font-size:18px">Čaká sa na údaje</b><div style="font-size:14px;line-height:1.5;color:#536577;margin-top:5px">${a.last_error ? 'Zdroj pri poslednej obnove neposkytol zápas.' : 'Záznam zatiaľ nie je dostupný.'}</div></div></div>`;
        const result=({win:'Výhra',loss:'Prehra',draw:'Remíza'})[entity.state]||entity.state;
        const color=entity.state==='win'?'rgba(157,196,179,.26)':entity.state==='loss'?'rgba(218,175,184,.25)':'rgba(187,171,213,.2)';
        const modes={dom:'Domination',of:'Offensive',def:'Defusal',tdm:'Team Deathmatch',gg:'Gun Game',ffa:'Free For All',inf:'Infected',ttt:'Trouble Town',boot:'Bootcamp'};
        const numbers=[['kills','Eliminácie'],['deaths','Úmrtia'],['assists','Asistencie'],['score','Skóre']].map(([k,l])=>`<div><b style="font-size:32px">${typeof a[k]==='number'&&Number.isFinite(a[k])?a[k].toLocaleString('sk-SK'):'—'}</b><div style="font-size:14px;color:#536577">${l}</div></div>`).join('');
        const t=a.ended_at?new Date(a.ended_at):null;
        const when=t&&Number.isFinite(t.getTime())?t.toLocaleString('sk-SK',{timeZone:hass.config.time_zone,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
        const duration=typeof a.duration_seconds==='number'?`${(a.duration_seconds/60).toFixed(2)} min`:'—';
        return `${title}<div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><b style="font-size:24px;overflow-wrap:anywhere">${esc(a.map||'Neznáma mapa')}</b><span style="font-size:14px;padding:5px 9px;border-radius:8px;background:${color}">${esc(result)}</span></div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:13px 0 10px">${numbers}</div><div style="font-size:14px;color:#536577">${esc(modes[a.game]||a.game||'—')} · ${duration} · ${esc(when)}${a.placement!=null?' · #'+esc(a.placement):''}</div>${a.player_team?`<div style="font-size:14px;color:#536577;margin-top:4px">Tvoj tím: ${esc(a.player_team)} · víťaz: ${esc(a.winner_team)}</div>`:''}${a.stale?'': ''}${entity.attributes.stale?'<div style="font-size:14px;margin-top:5px;color:#536577">Posledný dostupný záznam · staršia kópia</div>':''}`;
        ]]]
  - type: custom:button-card
    entity: sensor.service_denkz0ne_tracked_matches
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: *id001
    triggers_update:
    - sensor.service_denkz0ne_tracked_matches
    - sensor.service_denkz0ne_recorded_wins
    - sensor.service_denkz0ne_recorded_losses
    - sensor.service_denkz0ne_recorded_win_rate
    - sensor.service_denkz0ne_average_recorded_match_score
    - sensor.service_denkz0ne_most_played_map
    variables:
      title: Tvoje zachytené zápasy
      items:
      - [sensor.service_denkz0ne_tracked_matches, Vzorka zápasov, '', 0]
      - [sensor.service_denkz0ne_recorded_wins, Výhry, '', 0]
      - [sensor.service_denkz0ne_recorded_losses, Prehry, '', 0]
      - [sensor.service_denkz0ne_recorded_win_rate, Úspešnosť, '%', 2]
      - [sensor.service_denkz0ne_average_recorded_match_score, Ø skóre, '', 2]
      - ['@map', Najhranejšia mapa, '', 0]
      tint: '#fff4e8'
      size: 32
      note: Analytická vzorka API · nejde o celú kariéru.
    custom_fields:
      body: *id002
  - type: custom:tabbed-card
    styles: *id003
    grid_options: {columns: 12, rows: auto}
    tabs:
    - attributes: {label: Moje mapy}
      card:
        type: custom:button-card
        entity: sensor.service_denkz0ne_most_played_map
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        variables:
          collection: maps
        custom_fields:
          body: &id004 |-
            [[[
            const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
            const f=(v,d=0)=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('sk-SK',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
            const world=variables.collection==='world';
            let rows=entity?.attributes?.[world?'maps':variables.collection];
            if(!Array.isArray(rows)||!rows.length)return '<div style="font-size:14px;color:#536577;padding:20px 0">Výkon na mapách a v režimoch sa zobrazí po načítaní analytiky.</div>';
            let headers, note;
            if(world){
              rows=rows.map(r=>{const m=r.modes?.find(x=>x.mode==='dom')||r.modes?.[0];return {name:r.map,mode:m?.mode,games:m?.matches,allies:m?.teams?.find(t=>t.team==='Allies')?.winRate,axis:m?.teams?.find(t=>t.team==='Axis')?.winRate};});
              headers=['Mapa','Záp.','Spoj. %','Os %'];note='Celá hra · Domination, prípadne prvý dostupný režim.';
            }else{rows=[...rows];headers=[variables.collection==='maps'?'Mapa':'Režim','Záp.','Výhry %','K/D','Ø skóre'];note='Tvoje zachytené zápasy · pomery zaokrúhlené na 2 miesta.';}
            rows.sort((a,b)=>(b.games??-1)-(a.games??-1));
            const head=headers.map((v,i)=>`<th style="text-align:${i?'right':'left'};padding:6px 3px;border-bottom:1px solid #dfe6ed;font-size:14px;font-weight:600;color:#536577;white-space:nowrap">${v}</th>`).join('');
            const body=rows.map((r,i)=>{
              const rate=typeof r.games==='number'&&r.games>0&&typeof r.wins==='number'?100*r.wins/r.games:null;
              const values=world?[f(r.games),f(typeof r.allies==='number'?100*r.allies:null,2),f(typeof r.axis==='number'?100*r.axis:null,2)]:[f(r.games),f(rate,2),f(r.kd,2),f(r.avgScore,2)];
              return `<tr style="background:${i%2?'rgba(128,128,128,.045)':'transparent'}"><td style="padding:7px 3px;font-weight:600;max-width:140px;overflow-wrap:anywhere">${esc(r.name||r.mapName||r.key)}${world?`<small style="display:block;font-weight:400;font-size:14px;color:#536577">${esc(r.mode)}</small>`:''}</td>${values.map(v=>`<td style="text-align:right;padding:7px 3px;white-space:nowrap;font-variant-numeric:tabular-nums">${v}</td>`).join('')}</tr>`;
            }).join('');
            return `<div style="height:250px;overflow:auto;font-size:14px"><table style="width:100%;border-collapse:collapse"><thead>${head}</thead><tbody>${body}</tbody></table></div><div style="font-size:14px;color:#536577;margin-top:7px">${note}</div>`;
            ]]]
    - attributes: {label: Moje režimy}
      card:
        type: custom:button-card
        entity: sensor.service_denkz0ne_most_played_map
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        variables:
          collection: modes
        custom_fields:
          body: *id004
    - attributes: {label: Mapy v hre}
      card:
        type: custom:button-card
        entity: sensor.service_denkz0ne_maps_with_statistics
        section_mode: true
        show_name: false
        show_icon: false
        show_state: false
        tap_action: {action: none}
        hold_action: {action: more-info}
        grid_options: {columns: 12, rows: auto}
        styles: *id001
        variables:
          collection: world
        custom_fields:
          body: *id004
- type: grid
  cards:
  - type: heading
    heading: Vývoj a hra
    icon: mdi:chart-line
    heading_style: title
    card_mod:
      style: 'ha-card { color: #243744; --primary-text-color: #243744; --secondary-text-color: #536577; }'
  - type: custom:button-card
    entity: sensor.denkz0ne_players_online
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: *id001
    triggers_update:
    - sensor.denkz0ne_players_online
    - sensor.service_denkz0ne_domination_players
    - sensor.service_denkz0ne_offensive_players
    - sensor.service_denkz0ne_defusal_players
    - sensor.service_denkz0ne_team_deathmatch_players
    - sensor.service_denkz0ne_gun_game_players
    - sensor.service_denkz0ne_free_for_all_players
    - sensor.service_denkz0ne_infected_players
    - sensor.service_denkz0ne_trouble_town_players
    - sensor.service_denkz0ne_bootcamp_players
    custom_fields:
      body: |-
        [[[
        const n=entity&&!['unknown','unavailable',''].includes(entity.state)?Number(entity.state):NaN;
        const modes=[['domination','Domination'],['offensive','Offensive'],['defusal','Defusal'],['team_deathmatch','TDM'],['gun_game','Gun Game'],['free_for_all','FFA'],['infected','Infected'],['trouble_town','Trouble Town'],['bootcamp','Bootcamp']];
        let available=false;
        const tags=modes.map(([key,label])=>{const e=hass.states[`sensor.service_denkz0ne_${key}_players`];const count=e&&!['unknown','unavailable',''].includes(e.state)?Number(e.state):NaN;available||=Number.isFinite(count);return Number.isFinite(count)&&count>=1?`<span style="background:rgba(157,190,217,.16);padding:4px 7px;border-radius:7px;white-space:nowrap">${label} <b>${count}</b></span>`:'';}).join('');
        return `<div style="display:flex;align-items:center;justify-content:space-between"><div><b style="font-size:15px">Hráči online</b><div style="font-size:14px;color:#536577;margin-top:3px">Celá hra${entity?.attributes?.stale?' · staršia kópia':''}</div></div><b style="font-size:40px;line-height:1.15;letter-spacing:-1px;color:#243744">${Number.isFinite(n)?n.toLocaleString('sk-SK'):'—'}</b></div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:8px;font-size:14px">${tags||`<span style="color:#536577">${available?'Žiadny režim nemá zverejneného hráča.':'Rozpis podľa režimov momentálne nie je dostupný.'}</span>`}</div>`;
        ]]]
  - type: custom:tabbed-card
    styles: *id003
    grid_options: {columns: 12, rows: auto}
    tabs:
    - attributes: {label: XP}
      card:
        type: custom:apexcharts-card
        graph_span: 7d
        header:
          show: true
          title: XP · uložené snímky za 7 dní
          show_states: false
        hours_12: false
        all_series_config:
          type: line
          curve: stepline
          extend_to: false
          stroke_width: 2
          float_precision: 0
          show:
            legend_value: false
        apex_config: &id005
          theme:
            mode: light
          chart:
            foreColor: '#536577'
            fontFamily: Roboto, Arial, sans-serif
            height: 188
            toolbar:
              show: false
            zoom:
              enabled: false
            animations:
              enabled: false
          grid:
            borderColor: '#dfe6ed'
            strokeDashArray: 3
          dataLabels:
            enabled: false
          fill:
            type: solid
            opacity: 1
          legend:
            fontSize: 14px
          tooltip:
            x:
              format: dd. MM. HH:mm
          xaxis:
            labels:
              datetimeUTC: false
              style:
                fontSize: 14px
          yaxis:
            labels:
              style:
                fontSize: 14px
        card_mod: &id006
          style: 'ha-card { background: #ffffff; color: #243744; --primary-text-color: #243744; --secondary-text-color: #536577;
            border-radius: 14px; box-shadow: none; border: 1px solid #dfe6ed; } .header { font-size: 16px; }'
        series:
        - entity: sensor.service_denkz0ne_recorded_profile_history
          name: Celkové XP
          color: '#b4a0ce'
          unit: XP
          data_generator: |-
            return (entity?.attributes?.history_points || [])
              .filter(p => typeof p.exp === 'number' && Number.isFinite(p.exp))
              .map(p => [Date.parse(p.capturedAt), p.exp])
              .filter(p => Number.isFinite(p[0]) && p[0] >= start.getTime() && p[0] <= end.getTime())
              .sort((a,b) => a[0]-b[0]);
    - attributes: {label: Boj}
      card:
        type: custom:apexcharts-card
        graph_span: 7d
        header:
          show: true
          title: Celkové eliminácie a úmrtia · 7 dní
          show_states: false
        hours_12: false
        all_series_config:
          type: line
          curve: stepline
          extend_to: false
          stroke_width: 2
          float_precision: 0
          show:
            legend_value: false
        apex_config: *id005
        card_mod: *id006
        series:
        - entity: sensor.service_denkz0ne_recorded_profile_history
          name: Eliminácie
          color: '#9fc3ad'
          unit: ''
          data_generator: |-
            return (entity?.attributes?.history_points || [])
              .filter(p => typeof p.kills === 'number' && Number.isFinite(p.kills))
              .map(p => [Date.parse(p.capturedAt), p.kills])
              .filter(p => Number.isFinite(p[0]) && p[0] >= start.getTime() && p[0] <= end.getTime())
              .sort((a,b) => a[0]-b[0]);
        - entity: sensor.service_denkz0ne_recorded_profile_history
          name: Úmrtia
          color: '#d2a7b2'
          unit: ''
          data_generator: |-
            return (entity?.attributes?.history_points || [])
              .filter(p => typeof p.deaths === 'number' && Number.isFinite(p.deaths))
              .map(p => [Date.parse(p.capturedAt), p.deaths])
              .filter(p => Number.isFinite(p[0]) && p[0] >= start.getTime() && p[0] <= end.getTime())
              .sort((a,b) => a[0]-b[0]);
    - attributes: {label: Online}
      card:
        type: custom:apexcharts-card
        graph_span: 24h
        header:
          show: true
          title: Hráči online · história API za 24 h
          show_states: false
        hours_12: false
        all_series_config:
          type: line
          curve: stepline
          extend_to: false
          stroke_width: 2
          float_precision: 0
          show:
            legend_value: false
        apex_config: *id005
        card_mod: *id006
        series:
        - entity: sensor.service_denkz0ne_online_history_readings
          name: Online
          unit: hráčov
          color: '#9dbbd3'
          curve: straight
          data_generator: |-
            return (entity?.attributes?.points || [])
              .filter(p => typeof p.playersOnline === 'number' && Number.isFinite(p.playersOnline))
              .map(p => [Date.parse(p.t), p.playersOnline])
              .filter(p => Number.isFinite(p[0]) && p[0] >= start.getTime() && p[0] <= end.getTime())
              .sort((a,b) => a[0]-b[0]);
    - attributes: {label: Hra}
      card:
        type: custom:apexcharts-card
        graph_span: 30d
        header:
          show: true
          title: Zachytené zápasy v celej hre · 30 dní
          show_states: false
        hours_12: false
        all_series_config:
          type: line
          curve: stepline
          extend_to: false
          stroke_width: 2
          float_precision: 0
          show:
            legend_value: false
        apex_config: *id005
        card_mod: *id006
        series:
        - entity: sensor.service_denkz0ne_recorded_match_trend_days
          name: Zápasy / deň
          unit: zápasov
          color: '#b2c4ad'
          type: column
          data_generator: |-
            return (entity?.attributes?.daily || [])
              .filter(p => typeof p.matches === 'number' && Number.isFinite(p.matches))
              .map(p => [Date.parse(p.date + 'T00:00:00Z'), p.matches])
              .filter(p => Number.isFinite(p[0]) && p[0] >= start.getTime() && p[0] <= end.getTime())
              .sort((a,b) => a[0]-b[0]);
  - type: custom:button-card
    entity: sensor.service_denkz0ne_statistics_api_polling_status
    section_mode: true
    show_name: false
    show_icon: false
    show_state: false
    tap_action: {action: none}
    hold_action: {action: more-info}
    grid_options: {columns: 12, rows: auto}
    styles: *id001
    triggers_update:
    - sensor.service_denkz0ne_experience
    - sensor.service_denkz0ne_recorded_competitive_rank
    - sensor.service_denkz0ne_most_played_map
    - sensor.service_denkz0ne_statistics_api_polling_status
    - sensor.denkz0ne_statistics_service_status
    - sensor.service_denkz0ne_cloud_api_polling_status
    custom_fields:
      body: |-
        [[[
        const state=id=>hass.states[id]?.state;
        const attrs=id=>hass.states[id]?.attributes||{};
        const esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        const when=v=>{const d=v?new Date(v):null;return d&&Number.isFinite(d.getTime())?d.toLocaleString('sk-SK',{timeZone:hass.config.time_zone,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';};
        const labels={online:'V poriadku',degraded:'Obmedzená',available:'Dostupné',rate_limited:'Čaká na limit',unavailable:'Nedostupné',unknown:'—'};
        const chip=(id,label)=>{const s=state(id)||'unknown',ok=['online','available'].includes(s);return `<span style="font-size:14px;padding:5px 7px;border-radius:7px;background:${ok?'#edf7f0':'#fff4e8'}">${label}: <b>${labels[s]||esc(s)}</b></span>`;};
        const p=attrs('sensor.service_denkz0ne_experience'),h=attrs('sensor.service_denkz0ne_recorded_competitive_rank'),a=attrs('sensor.service_denkz0ne_most_played_map'),q=entity?.attributes||{};
        const observations=Array.isArray(h.rank_history)?h.rank_history:[],last=observations[observations.length-1];
        const number=v=>typeof v==='number'&&Number.isFinite(v)?v.toLocaleString('sk-SK',{maximumFractionDigits:2}):'—';
        const limit=number(q.api_rate_limit_limit),remaining=number(q.api_rate_limit_remaining),retry=number(q.api_retry_after);
        const dateRow=(label,value)=>`<div style="display:flex;justify-content:space-between;gap:8px;line-height:22px"><span>${label}</span><b style="text-align:right">${when(value)}</b></div>`;
        const warning=p.stale||p.source_stale||q.stale||q.source_stale;
        return `<div style="font-size:16px;font-weight:650;display:flex;gap:6px;align-items:center;margin-bottom:10px"><ha-icon icon="mdi:database-clock-outline" style="margin:0;--mdc-icon-size:20px;color:#547897;margin:0"></ha-icon>Čerstvosť a dostupnosť</div><div style="display:flex;flex-wrap:wrap;gap:5px">${chip('sensor.denkz0ne_statistics_service_status','Služba')}${chip('sensor.service_denkz0ne_statistics_api_polling_status','API')}${chip('sensor.service_denkz0ne_cloud_api_polling_status','Režimy')}</div><div style="display:grid;grid-template-columns:1fr;gap:3px;margin-top:12px;font-size:14px;color:#536577">${dateRow('Profil · snímka API',p.source_timestamp)}${dateRow('Skill · pozorovaný',last?.observedAt)}${dateRow('Analytika · snímka API',a.source_timestamp)}${dateRow('Profil · úspešne načítaný',p.last_successful_update)}</div>${warning?'<div style="font-size:14px;line-height:21px;padding:7px 9px;margin-top:9px;background:#fff4e8;border-radius:8px">Niektoré údaje sú zo staršej dostupnej kópie.</div>':''}<div style="border-top:1px solid #dfe6ed;margin-top:12px;padding-top:12px"><div style="font-size:16px;font-weight:650;display:flex;align-items:center;gap:6px;margin-bottom:9px"><ha-icon icon="mdi:api" style="margin:0;--mdc-icon-size:20px;margin:0;color:#806694"></ha-icon>Podrobnosti a limit API</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="padding:9px;background:#f3eef9;border-radius:10px"><div style="font-size:14px;line-height:20px;color:#536577">Zostávajúca kapacita</div><b style="font-size:30px;line-height:1.3">${remaining}<span style="font-size:17px;font-weight:500"> / ${limit}</span></b></div><div style="padding:9px;background:#edf3fa;border-radius:10px"><div style="font-size:14px;line-height:20px;color:#536577">Čakanie po limite</div><b style="font-size:30px;line-height:1.3">${retry}<span style="font-size:17px;font-weight:500"> s</span></b></div></div><div style="font-size:14px;color:#536577;margin-top:9px">${dateRow('Obnovenie kapacity v odpovedi',q.api_rate_limit_reset_at)}${dateRow('API · posledná odpoveď',q.api_last_successful_update||q.last_successful_update)}</div><div style="font-size:14px;line-height:21px;color:#536577;margin-top:8px">Kapacita je z poslednej odpovede API, nie denný limit. Čas načítania nie je čas zmeny v hre.</div>${q.api_last_error?`<div style="font-size:14px;line-height:21px;margin-top:8px;padding:8px;background:#fff4e8;border-radius:8px;overflow-wrap:anywhere">API: ${esc(q.api_last_error)}</div>`:''}</div>`;
        ]]]
cards: []
